<!DOCTYPE html>
<html>
    <head>
        <title>form example</title>
    </head
    <body>
        <form>
            firstname: <input type="text" name="first name"><placeholder="enter your name"><br><br>
            lastname:<input type="text" name="last name"><br><br>
            email-id:<input type="text" name="email"><br><br>
            password:<input type="password" name="password"><br><br>
            gender:<input type="radio" name="gender" value = "male">male
            gender:<input type="radio"name="gender" value = "female">female
            gender:<input type="radio"name="gender" value = "others">others<br><br>
            address:<input type="textarea" name="address"></form>textarea><br><br>
            hobbies:<input type="checkbox" name="hobbies" value="reading">reading
            hobbies:<input type="checkbox" name="hobbies" value="travelling">travelling
            hobbies:<input type="checkbox" name="hobbies" value="cooking">cooking
            hobbies:<input type="checkbox" name="hobbies" value="sports">sports<br><br>
            branch:<select name="branch">
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option><br><br>
                submit:<input type="submit" value ="submit"><br><br>
                reset:<input type="reset" value="reset>
        </form>
    </body>
</html>
