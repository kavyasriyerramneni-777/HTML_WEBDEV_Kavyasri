<!DOCTYPE html>
<html>
    <head>
        <title>lists</title>
    </head>
    <body>
        <h3>unorderd htmllist</h3>
        <u1>
            <li>cofee</li>
            <li>tea</li>
            <li>milk</li>
        </u1>
        <h3>ordered html list</h3>
        <ol>
            <li>cofee</li>
            <li>tea</li>
            <li>milk</li>
        </ol>
        <h3>description list</h3>
        <dl>
            <dt>cofee</dt>
            <dd>_black hot drink</dd>
            <dt>tea</dt>
            <dd>_brown hot drink</dd>
            <dt>milk</dt>
            <dd>_white cold drink</dd>
        </dl>
    </body>
</html>
